info:
  name: TranscriptionSugerences
  type: http
  seq: 1

http:
  method: POST
  url: "{{backendUrl}}analyze"
  body:
    type: json
    data: |-
      {
        "transcription": "Buenos días, ¿qué le ocurre? Hola, doctor. Desde ayer me encuentro bastante mal, con dolor de barriga y he ido varias veces al baño. ¿Puede describirme ese dolor abdominal? Es como retortijones, va y viene, y a veces es bastante intenso. Entiendo. ¿Ha tenido diarrea? Sí, varias veces desde anoche, y bastante líquida. ¿Ha notado náuseas o vómitos? Sí, he vomitado un par de veces esta mañana. ¿Ha tenido fiebre? Creo que un poco, me notaba caliente, pero no la he medido. De acuerdo. ¿Ha comido algo fuera de lo habitual o en mal estado recientemente? Pues ahora que lo dice, ayer comí fuera de casa, pero no noté nada raro en la comida. ¿Alguien más de su entorno tiene síntomas parecidos? Sí, un compañero también está hoy enfermo del estómago. Bien. Por lo que me comenta, parece un cuadro digestivo agudo. Voy a hacerle unas preguntas más y explorarle un poco. Vale. ¿Puede tumbarse en la camilla? (Tras la exploración) El abdomen está algo sensible, pero no hay signos de gravedad. ¿Es algo serio? En principio no parece grave. Lo más importante es mantenerse bien hidratado, beber líquidos en pequeñas cantidades y seguir una dieta suave durante unos días. ¿Necesito medicación? Podemos darle algo para controlar los vómitos y las molestias, pero muchas veces esto mejora solo en 24-72 horas. ¿Y cuándo debería preocuparme? Si no puede retener líquidos, tiene fiebre alta, sangre en las heces o el dolor empeora mucho, debería volver cuanto antes. De acuerdo, muchas gracias. A usted, cuídese y descanse.",
        "patient_id": "78009650H"
      }
  auth:
    type: bearer
    token: "{{JWT_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
