http:
  method: POST
  url: "{{backendUrl}}analyze"
  body:
    type: json
    data: |-
      {
        "transcription": "Buenos días, ¿qué le trae hoy por aquí? Hola, doctor. Vine porque en una revisión de la universidad me dijeron que tenía la tensión un poco alta y me recomendaron venir a controlarla. Entiendo. ¿Recuerda qué cifra le salió aproximadamente? Sí, creo que era algo como 145 sobre 90. De acuerdo. ¿Le habían dicho alguna vez que tuviera la tensión alta? No, nunca. La verdad es que me sorprendió bastante por la edad que tengo. La hipertensión puede aparecer también en personas jóvenes, aunque muchas veces no da síntomas y se detecta por casualidad, como en su caso. Vamos a volver a medirla aquí. Vale. Bien, ahora tiene 142/88, sigue un poco elevada. ¿Ha tomado café, bebidas energéticas o fumado antes de venir? Me tomé un café grande esta mañana y últimamente estoy tomando bastantes energéticas porque estoy de exámenes. Eso puede influir. ¿Hace ejercicio con frecuencia? No mucho, paso bastante tiempo sentado estudiando. ¿Y antecedentes familiares de hipertensión? Sí, mi padre tiene hipertensión desde hace años. De acuerdo. En personas jóvenes primero intentamos confirmar si realmente la tensión está elevada de forma mantenida. Le recomendaré controlar la tensión varios días y reducir cafeína, bebidas energéticas y sal. También es importante dormir bien y hacer algo de ejercicio regular. Vale, intentaré cambiar esos hábitos. Por ahora no parece necesario empezar medicación, pero sí hacer seguimiento. Le pediré una analítica y quiero volver a verle en unas semanas con varias mediciones de tensión tomadas en casa o en farmacia. Perfecto. ¿Es algo preocupante? De momento no, pero conviene controlarlo para evitar problemas a largo plazo si finalmente se confirma hipertensión. Entendido, muchas gracias. A usted, nos vemos en la próxima revisión.",
        "patient_id": "78009650H",
        "patient_age": 20
      }
  auth:
    type: bearer
    token: "{{JWT_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
