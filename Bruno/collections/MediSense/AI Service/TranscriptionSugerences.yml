info:
  name: TranscriptionSugerences
  type: http
  seq: 1

http:
  method: POST
  url: "{{backendUrl}}analyze"
  body:
    type: json
    data: |-
      {
        "transcription": "Buenos días, ¿qué le trae por aquí hoy? Hola, doctor. Desde hace dos días tengo fiebre bastante alta y me siento muy cansado. Entiendo. ¿Ha medido la temperatura? Sí, ayer por la noche tenía 38,7 °C. ¿Ha notado otros síntomas, como tos, dolor de garganta o molestias al respirar? Tengo algo de dolor de garganta y un poco de congestión, pero no me cuesta respirar. ¿Dolores musculares o de cabeza? Sí, especialmente dolor de cabeza y el cuerpo muy pesado. De acuerdo. ¿Ha tenido contacto reciente con alguien enfermo? Sí, en el trabajo varios compañeros han estado resfriados. Eso podría estar relacionado. Por lo que me cuenta, parece una infección viral común. Vamos a hacer una exploración rápida para confirmarlo. Vale. (Tras la exploración) La garganta está algo inflamada, pero no hay signos de infección bacteriana grave. ¿Necesito antibióticos? No en este caso. Los antibióticos no son efectivos contra los virus. Le recomiendo reposo, buena hidratación y tomar paracetamol para la fiebre. ¿Cuánto tiempo debería durar? Normalmente entre 3 y 5 días. Si la fiebre supera los 39 °C, dura más de una semana o aparecen nuevos síntomas como dificultad para respirar, vuelva inmediatamente. De acuerdo, muchas gracias, doctor. A usted. Cuídese y descanse.",
        "patient_id": "78009650H"
      }
  auth:
    type: bearer
    token: "{{JWT_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
