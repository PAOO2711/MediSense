http:
  method: POST
  url: "{{backendUrl}}analyze"
  body:
    type: json
    data: |-
      {
        "transcription": "Buenos días, ¿qué le ocurre? Hola, doctor. Desde hace un par de días me han salido unas ronchas en el pecho y me pican bastante. Entiendo. ¿Las ronchas aparecieron de repente o fueron saliendo poco a poco? Creo que aparecieron de repente. Por la noche tenía un poco de picor y al día siguiente ya tenía varias. ¿El picor es constante o va por momentos? Va por momentos, pero por la noche me molesta más. ¿Ha notado si las ronchas han aumentado de tamaño o se han extendido a otras partes del cuerpo? De momento solo están en el pecho y un poco cerca del cuello. ¿Ha cambiado recientemente de jabón, detergente, perfume o alguna prenda de ropa? Sí, ahora que lo dice, estrené una camiseta nueva hace unos días. ¿La lavó antes de usarla? No, directamente me la puse. Podría tratarse de una reacción alérgica o una dermatitis de contacto. ¿Ha tomado algún medicamento nuevo o comido algo diferente últimamente? No, nada fuera de lo normal. ¿Tiene fiebre, dificultad para respirar o hinchazón en labios o cara? No, solo el picor. Bien. Voy a examinar la zona. Claro. Veo varias ronchas rojizas superficiales compatibles con una irritación o reacción alérgica leve. Le recomendaré una crema con corticoide suave y un antihistamínico para el picor. Evite rascarse y use ropa de algodón holgada. De acuerdo. ¿Cuánto tardará en irse? Normalmente mejora en unos días. Si empeora, aparece fiebre, dificultad para respirar o las ronchas se extienden, vuelva inmediatamente. Perfecto, muchas gracias doctor. A usted. Que se mejore.",
        "patient_id": "78009650H",
        "patient_age": 20
      }
  auth:
    type: bearer
    token: "{{JWT_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
